name: Suno Manifold CI

on:
  push:
    branches:
      - suno-prompt-manifold
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Run Suno manifold tests
        run: npx --yes tsx@4.20.5 --test src/lib/suno/*.test.ts src/lib/manifold/*suno*.test.ts
      - run: npm run typecheck
      - name: Lint Suno manifold changes
        run: >-
          npx eslint
          src/lib/suno
          src/lib/manifold/types.ts
          src/lib/manifold/origin.ts
          src/lib/manifold/reducer.ts
          src/lib/manifold/store-suno.ts
          src/lib/manifold/store-suno.test.ts
          src/components/console/GenotypePicker.tsx
          src/components/console/LivingPromptPanel.tsx
          src/components/console/MutationDiff.tsx
          src/components/console/GenomeInspector.tsx
      - run: npm run build
